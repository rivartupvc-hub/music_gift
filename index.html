<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Music Space</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap');

:root {
  --bg: #0b0d12;
  --surface: #14171f;
  --surface-2: #1a1e28;
  --border: rgba(255,255,255,0.06);
  --text: #f0f4f8;
  --text-2: #a0aec0;
  --text-3: #718096;
  --accent: #5b9dff;
  --accent-soft: rgba(91,157,255,0.15);
  --radius: 16px;
  --radius-sm: 12px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
}

body {
  font-family: 'Vazirmatn', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  line-height: 1.5;
}

/* ========== LOADER ========== */
#loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
#loader.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.loader-spinner {
  width: 36px;
  height: 36px;
  border: 2px solid rgba(255,255,255,0.08);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ========== GATE ========== */
#gate {
  position: fixed;
  inset: 0;
  z-index: 9000;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#gate.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.gate-box {
  text-align: center;
  padding: 0 24px;
}
.gate-label {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text-3);
  margin-bottom: 16px;
  direction: ltr;
}
.gate-title {
  font-size: 26px;
  font-weight: 500;
  margin-bottom: 12px;
  color: var(--text);
}
.gate-sub {
  font-size: 14px;
  color: var(--text-2);
  margin-bottom: 40px;
  font-weight: 300;
}
.enter-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 1px solid rgba(91,157,255,0.3);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
}
.enter-btn:active {
  transform: scale(0.94);
}

/* ========== PASSWORD ========== */
#vault {
  position: fixed;
  inset: 0;
  z-index: 9500;
  background: rgba(11,13,18,0.85);
  backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#vault.show {
  display: flex;
}
.vault-card {
  width: 100%;
  max-width: 340px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px 24px;
  text-align: center;
}
.vault-card h2 {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 8px;
}
.vault-card p {
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 24px;
}
.vault-input {
  width: 100%;
  height: 48px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 18px;
  text-align: center;
  letter-spacing: 8px;
  outline: none;
  font-family: inherit;
  margin-bottom: 16px;
}
.vault-input:focus {
  border-color: var(--accent);
}
.vault-btn {
  width: 100%;
  height: 46px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 500;
}
.vault-error {
  margin-top: 12px;
  font-size: 12px;
  color: #fc8181;
  min-height: 18px;
  opacity: 0;
}
.vault-error.show {
  opacity: 1;
}

/* ========== MAIN ========== */
#stage {
  max-width: 480px;
  margin: 0 auto;
  padding: 40px 20px 100px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
#stage.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 36px;
}
.header-label {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-3);
  margin-bottom: 8px;
  direction: ltr;
}
.header-title {
  font-size: 24px;
  font-weight: 500;
  margin-bottom: 8px;
}
.header-desc {
  font-size: 13px;
  color: var(--text-2);
  font-weight: 300;
  line-height: 1.7;
}

/* Playlist */
.section-title {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 1px;
  margin-bottom: 14px;
  direction: ltr;
}
.tracklist {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 40px;
}
.track {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  cursor: pointer;
  transition: background 0.2s;
  border-bottom: 1px solid var(--border);
}
.track:last-child {
  border-bottom: none;
}
.track:active {
  background: rgba(255,255,255,0.03);
}
.track.active {
  background: var(--accent-soft);
}
.track-num {
  width: 24px;
  font-size: 12px;
  color: var(--text-3);
  text-align: center;
  flex-shrink: 0;
}
.track.active .track-num {
  color: var(--accent);
}
.track-info {
  flex: 1;
  min-width: 0;
}
.track-title {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.track.active .track-title {
  color: var(--accent);
}
.track-artist {
  font-size: 12px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track-icon {
  font-size: 12px;
  color: var(--text-3);
  opacity: 0.5;
}
.track.active .track-icon {
  color: var(--accent);
  opacity: 1;
}

/* Player */
.player {
  text-align: center;
}
.cover {
  width: 180px;
  height: 180px;
  border-radius: 20px;
  object-fit: cover;
  margin: 0 auto 24px;
  display: block;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  background: var(--surface-2);
}
.song-title {
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 6px;
}
.song-artist {
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 28px;
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 28px;
}
.ctrl {
  background: none;
  border: none;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  opacity: 0.7;
  padding: 8px;
  transition: opacity 0.2s, transform 0.15s;
}
.ctrl:active {
  transform: scale(0.9);
  opacity: 1;
}
.play-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(91,157,255,0.3);
  transition: transform 0.15s;
}
.play-btn:active {
  transform: scale(0.94);
}

/* Progress */
.progress-wrap {
  max-width: 320px;
  margin: 0 auto 8px;
}
.progress {
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  cursor: pointer;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 4px;
  transition: width 0.1s linear;
}
.time {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
  max-width: 320px;
  margin: 8px auto 0;
  direction: ltr;
}

/* Lyrics */
.lyrics-box {
  margin-top: 40px;
  text-align: center;
}
.lyrics-label {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 2px;
  margin-bottom: 16px;
  direction: ltr;
}
.lyrics {
  font-size: 14px;
  color: var(--text-2);
  line-height: 2.2;
  font-weight: 300;
}
.lyrics p {
  margin: 0;
  padding: 2px 0;
}

/* Footer */
.footer {
  margin-top: 60px;
  text-align: center;
  font-size: 12px;
  color: var(--text-3);
  font-weight: 300;
  line-height: 1.8;
}
</style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="loader-spinner"></div>
</div>

<!-- Gate -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-label">MUSIC SPACE</div>
    <div class="gate-title">یه فضای کوچیک برای موسیقی</div>
    <div class="gate-sub">برای ورود لمس کن</div>
    <div class="enter-btn" id="enterBtn">♪</div>
  </div>
</div>

<!-- Password -->
<div id="vault">
  <div class="vault-card">
    <h2>ورود</h2>
    <p>رمز را وارد کنید</p>
    <input id="passInput" class="vault-input" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
    <button id="passBtn" class="vault-btn">ورود</button>
    <div id="passError" class="vault-error">رمز اشتباه است</div>
  </div>
</div>

<!-- Main -->
<main id="stage">
  <div class="header">
    <div class="header-label">PERSONAL PLAYLIST</div>
    <h1 class="header-title">موسیقی</h1>
    <p class="header-desc">چند آهنگ برای لحظه‌های مختلف</p>
  </div>

  <div class="section-title">PLAYLIST</div>
  <div class="tracklist" id="tracklist">
    <!-- tracks will be injected -->
  </div>

  <div class="player">
    <img id="cover" class="cover" src="" alt="cover">
    <div class="song-title" id="songTitle">—</div>
    <div class="song-artist" id="songArtist">—</div>

    <div class="controls">
      <button class="ctrl" id="prevBtn">⏮</button>
      <button class="ctrl" id="back15">⏪</button>
      <button class="play-btn" id="playBtn">▶</button>
      <button class="ctrl" id="fwd15">⏩</button>
      <button class="ctrl" id="nextBtn">⏭</button>
    </div>

    <div class="progress-wrap">
      <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="lyrics-box">
      <div class="lyrics-label">LYRICS</div>
      <div class="lyrics" id="lyrics"></div>
    </div>
  </div>

  <div class="footer">
    برای لحظه‌های خوب
  </div>
</main>

<audio id="audio" preload="metadata"></audio>

<script>
(function() {
  const PASSWORD = "1385";
  let songs = [];
  let current = 0;
  let isPlaying = false;

  const $ = id => document.getElementById(id);

  // Elements
  const loader = $("loader");
  const gate = $("gate");
  const enterBtn = $("enterBtn");
  const vault = $("vault");
  const passInput = $("passInput");
  const passBtn = $("passBtn");
  const passError = $("passError");
  const stage = $("stage");
  const tracklist = $("tracklist");
  const cover = $("cover");
  const songTitle = $("songTitle");
  const songArtist = $("songArtist");
  const playBtn = $("playBtn");
  const prevBtn = $("prevBtn");
  const nextBtn = $("nextBtn");
  const back15 = $("back15");
  const fwd15 = $("fwd15");
  const progress = $("progress");
  const progressBar = $("progressBar");
  const currentTime = $("currentTime");
  const duration = $("duration");
  const lyrics = $("lyrics");
  const audio = $("audio");

  // Format time
  function formatTime(s) {
    if (!s || !isFinite(s)) return "0:00";
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ":" + (sec < 10 ? "0" : "") + sec;
  }

  // Load songs
  async function loadSongs() {
    try {
      const res = await fetch("songs.json?t=" + Date.now());
      const data = await res.json();
      if (Array.isArray(data) && data.length) {
        songs = data;
      } else {
        throw new Error();
      }
    } catch {
      songs = [{
        title: "آهنگ نمونه",
        artist: "نامشخص",
        src: "song-1.mp3",
        cover: "cover-1.jpg",
        lyrics: ["متن آهنگ در دسترس نیست"]
      }];
    }
    renderPlaylist();
    loadTrack(0, false);
    loader.classList.add("hide");
  }

  // Render playlist
  function renderPlaylist() {
    let html = "";
    songs.forEach((song, i) => {
      const active = i === current ? "active" : "";
      html += `
        <div class="track ${active}" data-index="${i}">
          <div class="track-num">${i + 1}</div>
          <div class="track-info">
            <div class="track-title">${song.title || "بدون نام"}</div>
            <div class="track-artist">${song.artist || ""}</div>
          </div>
          <div class="track-icon">${i === current && isPlaying ? "❚❚" : "▶"}</div>
        </div>
      `;
    });
    tracklist.innerHTML = html;
  }

  // Load track
  function loadTrack(index, autoplay = false) {
    if (!songs.length) return;
    current = (index + songs.length) % songs.length;
    const song = songs[current];

    cover.src = song.cover || "";
    songTitle.textContent = song.title || "—";
    songArtist.textContent = song.artist || "—";

    // Lyrics
    lyrics.innerHTML = "";
    const lines = Array.isArray(song.lyrics) ? song.lyrics : [];
    if (lines.length) {
      lines.forEach(line => {
        if (line && line.trim()) {
          const p = document.createElement("p");
          p.textContent = line;
          lyrics.appendChild(p);
        }
      });
    } else {
      lyrics.innerHTML = "<p>متن آهنگ موجود نیست</p>";
    }

    audio.src = song.src || "";
    audio.load();
    progressBar.style.width = "0%";
    currentTime.textContent = "0:00";
    duration.textContent = "0:00";

    renderPlaylist();

    if (autoplay) {
      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = "❚❚";
        renderPlaylist();
      }).catch(() => {});
    } else {
      isPlaying = false;
      playBtn.textContent = "▶";
    }
  }

  // Events
  enterBtn.addEventListener("click", () => {
    vault.classList.add("show");
    setTimeout(() => passInput.focus(), 200);
  });

  function checkPass() {
    if (passInput.value.trim() === PASSWORD) {
      passError.classList.remove("show");
      vault.classList.remove("show");
      gate.classList.add("hide");
      stage.classList.add("visible");
    } else {
      passError.classList.add("show");
      passInput.value = "";
      passInput.focus();
    }
  }

  passBtn.addEventListener("click", checkPass);
  passInput.addEventListener("keydown", e => {
    if (e.key === "Enter") checkPass();
  });

  tracklist.addEventListener("click", e => {
    const track = e.target.closest(".track");
    if (!track) return;
    const index = Number(track.dataset.index);
    if (index === current) {
      togglePlay();
    } else {
      loadTrack(index, true);
    }
  });

  function togglePlay() {
    if (audio.paused) {
      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = "❚❚";
        renderPlaylist();
      }).catch(() => {});
    } else {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = "▶";
      renderPlaylist();
    }
  }

  playBtn.addEventListener("click", togglePlay);
  prevBtn.addEventListener("click", () => loadTrack(current - 1, true));
  nextBtn.addEventListener("click", () => loadTrack(current + 1, true));
  back15.addEventListener("click", () => {
    audio.currentTime = Math.max(0, audio.currentTime - 15);
  });
  fwd15.addEventListener("click", () => {
    if (audio.duration) {
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 15);
    }
  });

  audio.addEventListener("loadedmetadata", () => {
    duration.textContent = formatTime(audio.duration);
  });

  audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = percent + "%";
    currentTime.textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener("ended", () => {
    loadTrack(current + 1, true);
  });

  progress.addEventListener("click", e => {
    if (!audio.duration) return;
    const rect = progress.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    audio.currentTime = percent * audio.duration;
  });

  // Start
  loadSongs();
})();
</script>
</body>
  </html>
